[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install --omit=dev"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "nft"
  directory = "netlify/functions"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
